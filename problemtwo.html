<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fake Store Products</title>
  <style>
    table {
      width: 90%;
      margin: 20px auto;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #444;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }

  
    
  </style>
</head>
<body>

<h2 style="text-align:center">Fake Store Product List</h2>

<button id="getData" style="display: block; margin: 20px auto;" >Get Details</button>

<table id="productTable">
  <thead>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Price </th>
      <th>Category</th>
    </tr>
  </thead>
  <tbody>
    
  </tbody>
</table>

<script>
    document.getElementById("getData").addEventListener("click",fetchProducts)
  async function fetchProducts() {
    try {
      const response = await fetch("https://fakestoreapi.com/products");
      const products = await response.json();

      const tbody = document.querySelector("#productTable tbody");

      products.forEach(product => {
        const row = document.createElement("tr");

        row.innerHTML = `
          <td>${product.id}</td>
          <td>${product.title}</td>
          <td>${product.price}</td>
          <td>${product.category}</td>
        `;

        tbody.appendChild(row);
      });

    } catch (error) {
      console.error("Error fetching products:", error);
    }
  }


//   fetchProducts();
</script>

</body>
</html>
